<!DOCTYPE html>

<head>
    <meta charset="UTF-8">

        content="Love Running, Club for runners in Dublin, Ireland, Urban running, trail running, dublin docklands, Phoenix Park">

    <title>Love Running</title>

    <link rel="apple-touch-icon" sizes="180x180" href="assets/favicon/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon/favicon-16x16.png">

<body>
<!--Header -->
    <header>
        <a href="index.html"> <h1 id="logo">Love Running</h1>
        </a>
        <input type="checkbox" id="nav-toggle" name="nav-toggle">
        <label for="nav-toggle" class="nav-toggle-label"><i class="fa-solid fa-bars"></i></label>
        <nav>
            <ul id="menu">
                <li><a href="index.html">Home</a></li>
                <li><a href="gallery.html">Gallery</a></li>
                <li><a href="signup.html" class="active">Sign Up</a></li>
            </ul>
        </nav>

    </header>
<!-- End of Header -->

<!-- Start of Main Section -->

    <main id="signup-main">
       <section id="signup">
            <form id="signup-form" post method="post" action="https://formdump.codeinstitute.net">
                <h1><i class="fa-solid fa-heart-pulse"></i> Let's Get You Signed Up!</h1>
                <div id="text-inputs"> 
                    <label for="first-name">First Name</label>
                    <input class="text-input" type="text" id="first-name" name="first-name" required>
                    <br>
                    <label for="last-name">Last Name</label>
                    <input class="text-input" type="text" id="last-name" name="last-name" required>
                    <br>
                    <label for="email-address">Email Address</label>
                    <input class="text-input" type="text" id="email-address" name="email-address" required>
                    <br>
                   
                </div>
                <div id="radio-inputs">
                    <div>
                    <label for="road">Road</label>
                    <input required class="radio" type="radio" id="road" name="running-preference" value="road">
                    </div>
                    
                    <div>
                    <label for="trail">Trail</label>
                    <input required class="radio" type="radio" id="trail" name="running-preference" value="trail">
                    </div>
                    
                    <div>
                    <label for="both">Both</label>
                    <input class="radio" type="radio" id="both" name="running-preference" value="both">
                    </div>
                    
                                        
                </div>
                <button type="submit" id="join-button">Let's Run!</button>
            </form>
       </section>
    </main>

    <!-- Footer -->
    <footer>
        <ul id="social-networks">
            <li><a href="https://www.facebook.com" target="_blank" rel="noopener" 
                aria-label="visit our facebook page (opens in a new tab)">

                <i class="fa-brands fa-twitter"></i>
            </a></li>
            <li><a href="https://www.youtube.com" target="_blank" rel="noopener" 
                aria-label="visit our youtube page (opens in a new tab)">
                <i class="fa-brands fa-youtube"></i>
            </a></li>
            <li><a href="https://www.instagram.com" target="_blank" rel="noopener" 
                aria-label="visit our instagram page (opens in a new tab)">
                <i class="fa-brands fa-instagram"></i>
            </a></li>
            
        </ul>
    </footer>
